<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xiaoyue Yu</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        color: #111;
        background: #f2f2f2;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(36rem, calc(100vw - 2rem));
        padding: 1.5rem;
        border: 1px solid rgba(0, 0, 0, 0.16);
        border-radius: 8px;
        background: #fff;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.6rem;
        font-weight: 500;
      }

      p {
        margin: 0;
        color: rgba(0, 0, 0, 0.62);
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Xiaoyue Yu</h1>
      <p>New website in progress.</p>
    </main>
  </body>
</html>
